    function inspect() {
      const box = $('insp');
      const sel = CKT.sel;
      if (!sel || sel.kind !== 'comp') {
        const m = MSN.list[MSN.i];
        const tip = m ? (NF.mode === 'kid' ? m.kid : m.eng) : 'Sandbox.';
        box.innerHTML =
          '<div class="mission on"><div class="panel-h" style="padding:0;border:0;height:auto">MISSION</div>' +
          '<b>' + (m ? m.title : 'SANDBOX') + '</b><p class="hint">' + tip + '</p></div>' +
          '<div class="hint">Place parts from the library. Drag pins to wire. Space runs the solver.</div>' +
          (NF.mode === 'engineer' ? '<div class="field"><span>SOLVER SELF-TEST</span><div class="hint">' + (SOL.self || '…') + '</div></div>' +
            '<div class="field"><span>NETLIST</span><textarea id="netbox" readonly></textarea></div>' : '');
        $('selname').textContent = '—';
        if (NF.mode === 'engineer' && $('netbox')) $('netbox').value = netlist();
        return;
      }
      const c = findComp(sel.id);
      if (!c) { box.innerHTML = ''; return; }
      const d = REG.get(c.type);
      $('selname').textContent = d.name;
      const phys = NF.mode === 'kid' ? d.kid : d.eng;
      let html = '<div class="hint">' + phys + '</div>';
      for (const p of d.params) {
        const val = c.params[p.id];
        html += '<div class="field"><label>' + p.name + (p.unit ? ' (' + p.unit + ')' : '') + '</label>';
        if (NF.mode === 'kid' && p.log) {
          html += '<input type="range" data-k="' + p.id + '" min="0" max="8" step="0.01" value="' +
            (Math.log10(Math.max(val, p.min)) - Math.log10(p.min)) / (Math.log10(p.max) - Math.log10(p.min)) * 8 + '" />';
          html += '<div class="hint">' + fmtU(val, p.unit) + '</div>';
        } else if (p.id === 'on') {
          html += '<button data-tog="on">' + (val ? 'CLOSED' : 'OPEN') + '</button>';
        } else {
          html += '<input type="number" data-k="' + p.id + '" value="' + val + '" step="any" />';
        }
        html += '</div>';
      }
      html += '<div class="field"><button id="b-rot">ROTATE</button> <button id="b-del">DELETE</button></div>';
      if (SOL.last && SOL.last.ok) {
        html += '<div class="field"><span>LIVE</span>';
        for (const pin of d.pins) {
          html += '<div class="kv"><i>' + pin.id + '</i><span>' + fmtU(SOL.vPin(c, pin.id), 'V') + '</span></div>';
        }
        if (c.state.I != null) html += '<div class="kv"><i>I</i><span>' + fmtU(c.state.I, 'A') + '</span></div>';
        if (c.state.P != null) html += '<div class="kv"><i>P</i><span>' + fmtU(c.state.P, 'W') + '</span></div>';
        html += '</div>';
      }
      if (NF.mode === 'engineer') {
        html += '<div class="field"><span>EQUATION</span><div class="hint" id="eqbox2"></div></div>';
      }
      box.innerHTML = html;
      box.querySelectorAll('input[data-k]').forEach((inp) => {
        inp.addEventListener('input', () => {
          const spec = d.params.find((p) => p.id === inp.getAttribute('data-k'));
          let v = parseFloat(inp.value);
          if (inp.type === 'range' && spec.log) {
            const t = parseFloat(inp.value) / 8;
            v = Math.pow(10, lerp(Math.log10(spec.min), Math.log10(spec.max), t));
            inp.nextSibling.textContent = fmtU(v, spec.unit);
          }
          if (isFinite(v)) c.params[spec.id] = v;
          if (!NF.running) solveDC();
        });
      });
      const tog = box.querySelector('[data-tog]');
      if (tog) tog.addEventListener('click', () => { c.params.on = c.params.on ? 0 : 1; inspect(); });
      const br = box.querySelector('#b-rot');
      if (br) br.addEventListener('click', () => { c.rot = (c.rot + 1) % 4; });
      const bd = box.querySelector('#b-del');
      if (bd) bd.addEventListener('click', removeSel);
      if (NF.mode === 'engineer' && $('eqbox2')) $('eqbox2').textContent = equationFor(c);
    }
    function equationFor(c) {
      switch (c.type) {
        case 'R': return 'I = V/R = (Va−Vb)/' + c.params.R;
        case 'C': return 'i = C dv/dt,  Geq = C/h = ' + c.params.C + '/' + NF.dt;
        case 'L': return 'v = L di/dt,  Geq = h/L';
        case 'D':
        case 'LED': return 'i = Is (exp(v/(n Vt)) − 1)';
        case 'OA': return 'Vo = sat(A (Vp−Vn), rails), A=' + c.params.A;
        case 'NPN': return 'Ebers-Moll  iC ≈ Is e^{vBE/Vt}  (active)';
        case 'NMOS': return 'Level-1  Id = k [(vGS−Vt)vDS − vDS²/2]';
        default: return c.type + ' — see architecture comment in source.';
      }
    }
    function netlist() {
      let s = '* NEURAL_FORGE netlist\n';
      const map = netsOf();
      for (const c of CKT.comps) {
        const d = REG.get(c.type);
        const pins = d.pins.map((p) => map.pinNode.get(c.id + ':' + p.id)).join(' ');
        const par = Object.keys(c.params).map((k) => k + '=' + c.params[k]).join(' ');
        s += c.type + c.id + ' ' + pins + ' ' + par + '\n';
      }
      return s;
    }

    /* ============================ MAIN LOOP ============================== */
    let acc = 0, lastT = 0, missAcc = 0;
    function frame(ts) {
      if (!lastT) lastT = ts;
      const dtms = Math.min(50, ts - lastT);
      lastT = ts;
      if (NF.running && (NF.analysis === 'tran' || NF.analysis === 'logic')) {
        const base = NF.mode === 'kid' ? 10 : 16;
        const budget = Math.min(window.innerWidth < 800 ? 40 : 80, Math.max(1, Math.round(base * NF.speed)));
        const h = NF.dt;
        for (let n = 0; n < budget; n++) {
          const r = stepTran(h);
          if (!r.ok) {
            setRun(false);
            toast('NO CONVERGE — check wiring or reduce timestep');
            AUD.bad();
            break;
          }
        }
      }
      missAcc += dtms;
      if (missAcc > 800) {
        missAcc = 0;
        if (NF.ready) {
          checkMission();
          const ae = document.activeElement;
          const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
          if (!typing) inspect();
        }
      }
      if (NF.view === 'gl') drawGL();
      else drawSchematic();
      drawScope();
      requestAnimationFrame(frame);
    }

    function cineActive() {
      return /(?:\?|&)cine=1(?:&|$)/.test(location.search);
    }
    function cineApply() {
      if (!cineActive()) return;
      const q = new URLSearchParams(location.search);
      $('boot').style.display = 'none';
      const toastEl = $('toast');
      if (toastEl) { toastEl.style.display = 'none'; toastEl.style.visibility = 'hidden'; }
      if (q.get('hud') === '0') {
        $('left').style.display = 'none';
        $('right').style.display = 'none';
        $('bottom').style.display = 'none';
        const app = $('app');
        app.style.gridTemplateColumns = '1fr';
        app.style.gridTemplateRows = 'var(--bar-h) 1fr';
        app.style.gridTemplateAreas = '"top" "view"';
      }
      function wipe() {
        CKT.comps = []; CKT.wires = []; CKT.junctions = [];
        CKT.sel = null; CKT.placing = null;
        NF.t = 0; SOL.x = null; SOL.histV = {}; SOL.prevI = {};
        scopeClear();
      }
      function W(ca, pa, cb, pb) {
        CKT.wires.push({
          id: uid(),
          a: { kind: 'comp', id: ca.id, pin: pa },
          b: { kind: 'comp', id: cb.id, pin: pb },
          pts: []
        });
      }
      function ledCircuit(opt) {
        wipe();
        const g = addComp('GND', 80, 90);
        const v = addComp('VDC', 0, 0); v.params.V = 5;
        const r1 = addComp('R', 90, 0); r1.params.R = 330;
        const led = addComp('LED', 180, 0);
        if (opt.wire) {
          W(v, 'n', g, 'g'); W(v, 'p', r1, 'a'); W(r1, 'b', led, 'a'); W(led, 'c', g, 'g');
        }
        if (opt.solve) solveDC();
        SCH.camX = opt.cx != null ? opt.cx : 90;
        SCH.camY = opt.cy != null ? opt.cy : 28;
        SCH.zoom = opt.zoom || 1.7;
        return { g: g, v: v, r1: r1, led: led };
      }
      const S = q.get('s') || 'empty';
      const T = parseFloat(q.get('t') || '0');
      if (S === 'empty') {
        wipe();
        SCH.camX = 40; SCH.camY = 10; SCH.zoom = 1.15;
      } else if (S === 'lib') {
        wipe();
        CKT.placing = 'LED';
        renderLib();
        const items = document.querySelectorAll('.lib-item');
        for (let i = 0; i < items.length; i++) {
          if (items[i].textContent.indexOf('LED') >= 0) {
            items[i].scrollIntoView({ block: 'center' });
            break;
          }
        }
        SCH.camX = 40; SCH.camY = 10; SCH.zoom = 1.15;
      } else if (S === 'place') {
        wipe();
        addComp('VDC', 0, 0);
        addComp('R', 90, 0);
        addComp('LED', 180, -20);
        addComp('GND', 90, 90);
        SCH.camX = 90; SCH.camY = 24; SCH.zoom = 1.65;
      } else if (S === 'wired') {
        ledCircuit({ wire: 1, zoom: 1.75 });
      } else if (S === 'live') {
        ledCircuit({ wire: 1, solve: 1, zoom: 1.8 });
      } else if (S === 'hero') {
        ledCircuit({ wire: 1, solve: 1, zoom: 2.35, cx: 140, cy: 8 });
      } else if (S === 'eng') {
        setMode('engineer');
        const ckt = ledCircuit({ wire: 1, solve: 1, zoom: 1.55, cy: 20 });
        CKT.sel = { kind: 'comp', id: ckt.led.id };
      } else if (S === 'digital') {
        setMode('engineer');
        wipe();
        const g = addComp('GND', 0, 80);
        const v = addComp('VCC', 0, 0); v.params.V = 5;
        const a1 = addComp('AND', 90, 0);
        const a2 = addComp('AND', 190, 0);
        W(v, 'p', a1, 'a'); W(v, 'p', a1, 'b'); W(a1, 'y', a2, 'a'); W(v, 'p', a2, 'b');
        solveDC();
        CKT.sel = { kind: 'comp', id: a2.id };
        SCH.camX = 110; SCH.camY = 8; SCH.zoom = 1.55;
      } else if (S === 'iso') {
        ledCircuit({ wire: 1, solve: 1, zoom: 1.4 });
        setView('gl');
        if (!GL.ready) initGL();
        GL.camT = 0.55 + T * 0.85;
        GL.camP = 0.34;
        GL.camR = 10.2;
        GL.panX = 3.6;
        GL.panY = 1.5;
        drawGL();
      } else if (S === 'boot') {
        $('boot').style.display = 'flex';
        $('bootbar').style.width = '100%';
      }
      inspect();
      NF.t = isFinite(T) ? T : 0;
      if (NF.view === 'gl') drawGL();
      else drawSchematic();
    }

    function boot() {
      const bar = $('bootbar');
      if (cineActive()) {
        $('boot').style.display = 'none';
      } else {
        let p = 0;
        const t = setInterval(() => {
          p += 0.08;
          bar.style.width = Math.min(100, p * 100) + '%';
          if (p >= 1) {
            clearInterval(t);
            $('boot').style.display = 'none';
          }
        }, 16);
      }
      bindSchematic();
      bindGLCam();
      bindUI();
      renderLibCats();
      renderLib();
      loadProgress();
      try {
        const auto = localStorage.getItem('nf_autosave');
        if (auto) {
          /* do not auto-restore — kids should see empty + first mission */
        }
      } catch (e) {}
      pushUndo();
      let ok = false;
      try { ok = selfTest(); } catch (e) {
        document.documentElement.setAttribute('data-err', String(e && e.message || e));
      }
      document.documentElement.setAttribute('data-selftest', ok ? 'PASS' : 'FAIL');
      document.documentElement.setAttribute('data-selfmsg', SOL.self || '');
      inspect();
      NF.maxUnknowns = window.innerWidth < 800 ? 40 : 80;
      NF.maxParticles = window.innerWidth < 800 ? 80 : 180;
      NF.ready = true;
      cineApply();
      requestAnimationFrame(frame);
      if (!cineActive()) {
        setTimeout(() => {
          toast(ok ? 'SOLVER ONLINE · DIVIDER SELF-TEST PASS' : 'SOLVER SELF-TEST FAILED', 2600);
        }, 700);
      }
    }

    window.addEventListener('error', (ev) => {
      document.documentElement.setAttribute('data-err', String(ev.message || ev.error || 'error'));
    });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
